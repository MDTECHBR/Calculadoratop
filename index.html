<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Empreendedor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        input[type="password"]::-webkit-textfield-decoration-container { display: none; }
        .input-global:focus, .select-global:focus { border-color: #4F46E5; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2); }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <!-- Tela de Login -->
    <div id="loginScreen" class="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm">
            <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">🔐 Acesso Restrito</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Administrador</label>
                    <input type="text" id="adminUser" value="admin" class="w-full px-4 py-3 border border-gray-300 rounded-xl input-global outline-none transition-all bg-gray-100" readonly>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                    <input type="password" id="adminPass" placeholder="Digite a senha" maxlength="4" class="w-full px-4 py-3 border border-gray-300 rounded-xl input-global outline-none transition-all">
                </div>
                <button onclick="checkLogin()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition-all transform hover:scale-[1.02]">
                    Entrar
                </button>
                <p id="loginError" class="text-red-500 text-sm text-center hidden">Senha incorreta!</p>
            </div>
        </div>
    </div>

    <!-- Conteúdo Principal -->
    <div id="mainApp" class="w-full max-w-2xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden mb-10 hidden">
        <header class="bg-indigo-600 text-white p-5 text-center">
            <h1 class="text-xl font-bold">Calculadora de Vendas</h1>
            <p id="headerDate" class="text-xs opacity-80"></p>
        </header>

        <main class="p-5 space-y-6">
            
            <!-- Dados da Empresa e Cliente -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="space-y-3">
                    <h3 class="font-semibold text-gray-700 border-b pb-2">Dados da Empresa</h3>
                    <input type="text" id="empresaNome" placeholder="Nome da Empresa" class="w-full px-3 py-2 border border-gray-200 rounded-lg input-global outline-none">
                    <input type="text" id="empresaDoc" placeholder="CNPJ ou CPF" class="w-full px-3 py-2 border border-gray-200 rounded-lg input-global outline-none">
                </div>
                <div class="space-y-3">
                    <h3 class="font-semibold text-gray-700 border-b pb-2">Dados do Cliente</h3>
                    <input type="text" id="clienteNome" placeholder="Nome do Cliente" class="w-full px-3 py-2 border border-gray-200 rounded-lg input-global outline-none">
                    <input type="text" id="clienteDoc" placeholder="CPF ou CNPJ" class="w-full px-3 py-2 border border-gray-200 rounded-lg input-global outline-none">
                </div>
            </div>

            <!-- ADICIONAR ITENS COMO NA IMAGEM -->
            <div class="space-y-4">
                <h3 class="font-semibold text-gray-700 text-lg">Adicionar Itens</h3>
                
                <!-- Campo para digitar o valor -->
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-xl">R$</span>
                    <input type="number" id="novoValor" step="0.01" placeholder="0,00" class="w-full pl-14 pr-4 py-4 text-2xl text-center border border-gray-300 rounded-xl input-global outline-none">
                </div>

                <!-- Botão Adicionar -->
                <button onclick="adicionarItem()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl text-lg transition-all flex items-center justify-center gap-2 shadow-md">
                    <span>➕</span> Adicionar à Lista
                </button>

                <!-- Lista de Itens Adicionados -->
                <div>
                    <h4 class="text-gray-600 font-medium mb-2">Itens da Venda:</h4>
                    <div id="itemsList" class="space-y-2 max-h-80 overflow-y-auto pr-1">
                        <!-- Os itens vão aparecer aqui -->
                    </div>
                </div>
            </div>

            <!-- Valores -->
            <div class="bg-gray-50 p-5 rounded-xl border">
                <div class="text-center">
                    <p class="text-gray-500 text-lg">Total a Pagar:</p>
                    <p id="valorTotal" class="text-4xl font-bold text-green-600">R$ 0,00</p>
                </div>
            </div>

            <!-- Recebimento -->
            <div class="space-y-4">
                <h3 class="font-semibold text-gray-700 text-lg">Recebimento</h3>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">R$</span>
                    <input type="number" id="valorRecebido" step="0.01" placeholder="Valor recebido do cliente" class="w-full pl-14 pr-4 py-4 border border-gray-300 rounded-xl input-global outline-none">
                </div>

                <button onclick="calcularTroco()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-xl text-lg transition-all flex items-center justify-center gap-2 shadow-md">
                    <span>💰</span> Calcular Troco
                </button>

                <div class="text-center bg-gray-50 p-4 rounded-xl">
                    <p class="text-gray-500">Troco:</p>
                    <p id="valorTroco" class="text-3xl font-bold text-red-600">R$ 0,00</p>
                </div>
            </div>

            <!-- Botão Gerar PDF -->
            <button onclick="generatePDF()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl text-lg transition-all shadow-lg flex items-center justify-center gap-2 mt-6">
                <span>🖨️</span> Gerar e Salvar Extrato (PDF)
            </button>

            <!-- Frase Volte Sempre -->
            <p class="text-center text-gray-600 text-lg mt-4">Volte sempre !</p>

        </main>

        <!-- Rodapé Pequeno -->
        <footer class="bg-gray-100 p-3 text-center text-[10px] text-gray-500">
            Processamento 100% local - suas informações nunca saem do seu navegador
        </footer>
    </div>

    <script>
        const CORRECT_PASSWORD = "1240";
        let itemCount = 0;
        let totalGeral = 0;
        let itensVenda = []; // Array para guardar os itens

        // --- LOGIN ---
        function checkLogin() {
            const pass = document.getElementById('adminPass').value;
            if(pass === CORRECT_PASSWORD) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                initApp();
            } else {
                document.getElementById('loginError').classList.remove('hidden');
                setTimeout(() => document.getElementById('loginError').classList.add('hidden'), 2000);
            }
        }

        document.getElementById('adminPass')?.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkLogin();
        });

        // --- APP LOGIC ---
        function initApp() {
            setCurrentDateTime();
        }

        function setCurrentDateTime() {
            const now = new Date();
            const options = { 
                year: 'numeric', month: '2-digit', day: '2-digit', 
                hour: '2-digit', minute: '2-digit', second: '2-digit' 
            };
            const dateStr = now.toLocaleString('pt-BR', options);
            document.getElementById('headerDate').innerText = dateStr;
        }

        function formatCurrency(value) {
            return value.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        // Função principal de adicionar item
        function adicionarItem() {
            const inputValor = document.getElementById('novoValor');
            const valor = parseFloat(inputValor.value.replace(',','.'));

            if(isNaN(valor) || valor <= 0) {
                alert('Digite um valor válido!');
                return;
            }

            itemCount++;
            totalGeral += valor;
            itensVenda.push({ id: itemCount, valor: valor }); // Guarda no array

            // Criar o elemento na lista
            const lista = document.getElementById('itemsList');
            const itemDiv = document.createElement('div');
            itemDiv.className = "flex justify-between items-center bg-white border border-gray-200 rounded-lg p-4 shadow-sm";
            itemDiv.id = `item-${itemCount}`;
            itemDiv.innerHTML = `
                <span class="font-medium text-gray-700">Item ${itemCount}</span>
                <div class="flex items-center gap-4">
                    <span class="font-bold text-lg">R$ ${formatCurrency(valor)}</span>
                    <button onclick="removerItem(${itemCount}, ${valor})" class="bg-red-100 hover:bg-red-200 text-red-600 w-8 h-8 flex items-center justify-center rounded-full font-bold text-xl">✕</button>
                </div>
            `;

            lista.appendChild(itemDiv);
            
            // Atualizar total e limpar campo
            document.getElementById('valorTotal').innerText = "R$ " + formatCurrency(totalGeral);
            inputValor.value = "";
            inputValor.focus();
        }

        // Permitir adicionar com a tecla Enter
        document.getElementById('novoValor')?.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') adicionarItem();
        });

        function removerItem(id, valor) {
            document.getElementById(`item-${id}`).remove();
            totalGeral -= valor;
            itensVenda = itensVenda.filter(item => item.id !== id); // Remove do array
            document.getElementById('valorTotal').innerText = "R$ " + formatCurrency(totalGeral);
            calcularTroco();
        }

        function calcularTroco() {
            const recebido = parseFloat(document.getElementById('valorRecebido').value.replace(',','.')) || 0;
            const troco = recebido - totalGeral;
            document.getElementById('valorTroco').innerText = "R$ " + formatCurrency(troco >= 0 ? troco : 0);
        }

        // --- PDF GENERATION COM QUEBRA DE PÁGINA AUTOMÁTICA ---
        async function generatePDF() {
            setCurrentDateTime();
            
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({
                orientation: 'p',
                unit: 'mm',
                format: 'a4'
            });

            // Obter dados atuais
            const dataAtual = new Date();
            const dataStr = dataAtual.toLocaleDateString('pt-BR');
            const horaStr = dataAtual.toLocaleTimeString('pt-BR');
            const recebido = parseFloat(document.getElementById('valorRecebido').value) || 0;
            const troco = recebido - totalGeral;

            // --- CABEÇALHO ---
            pdf.setFontSize(20);
            pdf.setTextColor(0, 100, 200);
            pdf.setFont("helvetica", "bold");
            pdf.text("EXTRATO DE VENDA", 105, 30, null, null, "center");
            
            pdf.setFontSize(10);
            pdf.setTextColor(80, 80, 80);
            pdf.setFont("helvetica", "normal");
            pdf.text(`Data: ${dataStr} às ${horaStr}`, 105, 38, null, null, "center");

            // --- TABELA ---
            const inicioY = 50;
            const alturaLinha = 8;
            const limitePagina = 270; // Quanto descer até o final da folha
            
            // Cabeçalho da tabela
            pdf.setFillColor(0, 100, 200);
            pdf.rect(20, inicioY - 5, 170, 10, 'F');
            pdf.setTextColor(255, 255, 255);
            pdf.setFont("helvetica", "bold");
            pdf.text("Descrição", 25, inicioY);
            pdf.text("Valor", 180, inicioY, null, null, "right");

            // Linhas da tabela
            pdf.setTextColor(0, 0, 0);
            pdf.setFont("helvetica", "normal");
            
            let posY = inicioY + alturaLinha;

            itensVenda.forEach(item => {
                // Verifica se precisa criar nova página
                if(posY > limitePagina) {
                    pdf.addPage();
                    posY = 20; // Volta para o topo da nova página
                }

                pdf.text(`Item ${item.id}`, 25, posY);
                pdf.text(`R$ ${formatCurrency(item.valor)}`, 180, posY, null, null, "right");
                posY += alturaLinha;
            });

            // Linha de total
            posY += 5;
            pdf.setFont("helvetica", "bold");
            pdf.setFontSize(12);
            pdf.text(`TOTAL: R$ ${formatCurrency(totalGeral)}`, 105, posY, null, null, "center");
            
            posY += 7;
            pdf.text(`RECEBIDO: R$ ${formatCurrency(recebido)}`, 105, posY, null, null, "center");
            
            posY += 7;
            pdf.setTextColor(0, 150, 0);
            pdf.text(`TROCO: R$ ${formatCurrency(troco >= 0 ? troco : 0)}`, 105, posY, null, null, "center");

            // Salvar
            const fileName = `Extrato_Venda_${dataAtual.getTime()}.pdf`;
            pdf.save(fileName);
            alert('PDF gerado com sucesso! Verifique seus downloads.');
        }
    </script>
</body>
</html>
